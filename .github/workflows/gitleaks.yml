# Scans every push and pull request for secrets. This is the only workflow: nothing here builds, tests or deploys.
# Deploys are done by hand from the owner's machine with the Vercel CLI.
name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the history and the working tree
        run: |
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
          ./gitleaks dir --config .gitleaks.toml --redact --no-banner --verbose .
